<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fidget Box app icon: a neon box on black with a glowing orb popping out of the lid.
       make-icons.mjs draws the black background and places the art between the markers. -->
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FE6FF"/><stop offset=".55" stop-color="#8A6BFF"/><stop offset="1" stop-color="#FF3FD8"/>
    </linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1838"/><stop offset="1" stop-color="#0E0C1F"/></linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241F4A"/><stop offset="1" stop-color="#120F28"/></linearGradient>
    <radialGradient id="orb" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFC4F4"/><stop offset="1" stop-color="#FF3FD8"/></radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7A4DFF" stop-opacity=".55"/><stop offset="1" stop-color="#7A4DFF" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <!--art-->
  <circle cx="256" cy="270" r="230" fill="url(#halo)"/>
  <!-- glow pass, then the crisp box -->
  <g filter="url(#glow)" opacity=".9" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linejoin="round">
    <path d="M136 232 256 292 376 232 376 352 256 412 136 352Z"/><path d="M256 292V412"/>
  </g>
  <path d="M136 232 256 292 256 412 136 352Z" fill="url(#faceL)"/>
  <path d="M376 232 256 292 256 412 376 352Z" fill="url(#faceR)"/>
  <g fill="none" stroke="url(#neon)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <path d="M136 232 256 292 376 232 376 352 256 412 136 352Z"/><path d="M256 292V412"/>
  </g>
  <!-- the lid, popped open and tilted -->
  <g transform="rotate(-14 200 190)">
    <path d="M128 196 248 136 368 196 248 256Z" fill="#1E1A40" opacity=".95"/>
    <path d="M128 196 248 136 368 196 248 256Z" fill="none" stroke="url(#neon)" stroke-width="11" stroke-linejoin="round" filter="url(#glow)" opacity=".8"/>
    <path d="M128 196 248 136 368 196 248 256Z" fill="none" stroke="url(#neon)" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <!-- the orb -->
  <circle cx="300" cy="150" r="56" fill="#FF3FD8" filter="url(#glow)" opacity=".85"/>
  <circle cx="300" cy="150" r="44" fill="url(#orb)"/>
  <!-- sparkles -->
  <path d="M392 92l7 19 19 7-19 7-7 19-7-19-19-7 19-7z" fill="#2FE6FF"/>
  <path d="M150 104l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#FFE07A"/>
  <circle cx="420" cy="196" r="7" fill="#FF3FD8"/>
  <!--/art-->
</svg>
