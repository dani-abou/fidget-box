<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Emoji-style bubble: one big glossy sky bubble and two small friends on lavender. -->
  <defs>
    <radialGradient id="big" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#BFE2FF"/><stop offset=".7" stop-color="#5AAEF0"/><stop offset="1" stop-color="#3B8FD6"/>
    </radialGradient>
    <radialGradient id="mint" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#B8F3E1"/><stop offset="1" stop-color="#3FC7A3"/>
    </radialGradient>
    <radialGradient id="peach" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#FFD9C9"/><stop offset="1" stop-color="#FF9E7A"/>
    </radialGradient>
  </defs>
  <g id="art">
    <circle cx="236" cy="276" r="150" fill="url(#big)"/>
    <ellipse cx="184" cy="212" rx="48" ry="30" fill="#fff" opacity=".9" transform="rotate(-35 184 212)"/>
    <circle cx="300" cy="350" r="14" fill="#fff" opacity=".45"/>
    <circle cx="372" cy="150" r="56" fill="url(#mint)"/>
    <ellipse cx="354" cy="130" rx="17" ry="11" fill="#fff" opacity=".9" transform="rotate(-35 354 130)"/>
    <circle cx="398" cy="372" r="38" fill="url(#peach)"/>
    <ellipse cx="386" cy="358" rx="12" ry="8" fill="#fff" opacity=".9" transform="rotate(-35 386 358)"/>
  </g>
</svg>
