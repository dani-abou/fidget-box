<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Halo: a silver crescent inside a faint glowing ring, on near-black -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#C8D3F0"/><stop offset="1" stop-color="#8E9CC8"/></linearGradient>
    <mask id="m"><rect width="512" height="512" fill="#fff"/><circle cx="296" cy="226" r="118" fill="#000"/></mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <!--bg--><rect width="512" height="512" fill="#05060B"/><!--/bg-->
  <!--art-->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#A9B8FF" stroke-width="5" filter="url(#glow)" opacity=".8"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#DDE4FF" stroke-width="2.5" opacity=".9"/>
  <circle cx="246" cy="266" r="124" fill="url(#s)" mask="url(#m)"/>
  <circle cx="380" cy="160" r="5" fill="#fff"/><circle cx="150" cy="380" r="3" fill="#fff" opacity=".7"/>
  <!--/art-->
</svg>
