<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ocean: a full moon low over the sea, its light rippling on the water -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04101F"/><stop offset=".55" stop-color="#0E3A55"/><stop offset=".56" stop-color="#062033"/><stop offset="1" stop-color="#020A14"/></linearGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFEFFF"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <!--bg--><rect width="512" height="512" fill="url(#sky)"/><!--/bg-->
  <!--art-->
  <circle cx="256" cy="200" r="96" fill="#BFF0FF" filter="url(#glow)" opacity=".6"/>
  <circle cx="256" cy="200" r="88" fill="url(#moon)"/>
  <g fill="#DFF6FF" opacity=".85">
    <rect x="196" y="306" width="120" height="7" rx="3.5"/><rect x="214" y="330" width="84" height="6" rx="3"/><rect x="180" y="354" width="152" height="6" rx="3" opacity=".7"/>
    <rect x="226" y="378" width="60" height="5" rx="2.5"/><rect x="200" y="402" width="112" height="5" rx="2.5" opacity=".6"/><rect x="236" y="426" width="40" height="4" rx="2" opacity=".6"/>
  </g>
  <!--/art-->
</svg>
