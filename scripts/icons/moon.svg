<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Moon: a glowing crescent and a few stars on midnight blue -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1030"/><stop offset="1" stop-color="#02030A"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7D6"/><stop offset="1" stop-color="#FFC95C"/></linearGradient>
    <mask id="cres"><rect width="512" height="512" fill="#fff"/><circle cx="318" cy="200" r="132" fill="#000"/></mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <!--bg--><rect width="512" height="512" fill="url(#sky)"/><!--/bg-->
  <!--art-->
  <circle cx="246" cy="262" r="150" fill="#FFD36E" filter="url(#glow)" opacity=".45" mask="url(#cres)"/>
  <circle cx="246" cy="262" r="150" fill="url(#moon)" mask="url(#cres)"/>
  <g fill="#fff"><path d="M392 304l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/><circle cx="410" cy="150" r="6"/><circle cx="350" cy="410" r="4"/><circle cx="120" cy="110" r="4"/></g>
  <!--/art-->
</svg>
