<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cat: a small black cat sitting on a golden crescent, midnight blue -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1030"/><stop offset="1" stop-color="#02030A"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7D6"/><stop offset="1" stop-color="#FFC95C"/></linearGradient>
    <mask id="m"><rect width="512" height="512" fill="#fff"/><circle cx="300" cy="230" r="140" fill="#000"/></mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <!--bg--><rect width="512" height="512" fill="url(#sky)"/><!--/bg-->
  <!--art-->
  <circle cx="236" cy="276" r="150" fill="#FFD36E" mask="url(#m)" filter="url(#glow)" opacity=".45"/>
  <circle cx="236" cy="276" r="150" fill="url(#moon)" mask="url(#m)"/>
  <!-- a sitting cat in profile, against the bright part of the moon, rim-lit in gold -->
  <g transform="translate(150 250) scale(1.15)" fill="#07081A" stroke="#FFD36E" stroke-width="3" stroke-linejoin="round">
    <path d="M60 150c-26 0-44-16-44-44 0-22 12-38 24-50l-4-22c-1-6 4-10 9-7l14 12c6-2 12-2 18 0l14-12c5-3 10 1 9 7l-4 22c10 10 14 22 14 34 0 4 0 8-1 12 14 8 22 22 22 38 0 6-4 10-10 10H60z"/>
    <path d="M124 150c24 0 36-14 32-34-3-14-16-18-24-12" fill="none" stroke-width="9" stroke="#07081A"/>
    <path d="M124 150c24 0 36-14 32-34-3-14-16-18-24-12" fill="none" stroke-width="3"/>
  </g>
  <g fill="#FFD36E"><circle cx="207" cy="300" r="4"/><circle cx="234" cy="300" r="4"/></g>
  <g fill="#fff"><circle cx="400" cy="150" r="4"/><circle cx="120" cy="120" r="3"/><circle cx="420" cy="400" r="3"/></g>
  <!--/art-->
</svg>
